[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-data-audit-agent"
version = "0.1.0"
description = "Local-first, evidence-grounded deletion audit engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = { text = "Proprietary portfolio project" }
authors = [{ name = "Ghost Data Audit contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Security",
  "Topic :: Database",
]

[project.optional-dependencies]
ocr = ["Pillow>=10.0", "pytesseract>=0.3.10"]
pdf = ["pypdf>=5.0"]
all = ["Pillow>=10.0", "pypdf>=5.0", "pytesseract>=0.3.10"]
test = ["Pillow>=10.0", "pypdf>=5.0", "httpx>=0.27"]
app = ["fastapi>=0.110", "uvicorn>=0.27", "streamlit>=1.32", "python-multipart>=0.0.9"]

[project.scripts]
ghost-audit = "ghost_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
